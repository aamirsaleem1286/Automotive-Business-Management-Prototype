<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoForge | Automotive Business Management Prototype</title>
<style>

een;gap:16px;align-items:flex-start;margin-bottom:22px}.eyebrow{font-size:10px;color:var(--red);letter-spacing:2px;font-weight:800}.pagehead h1{font-size:28px;margin:5px 0 4px;letter-spacing:-.7px}.sub{color:var(--muted);margin:0;max-width:760px}.btn{border:1px solid var(--line);background:#20262f;color:#fff;border-radius:8px;padding:10px 14px;font-weight:650}.btn:hover{filter:brightness(1.15)}.btn.primary{background:var(--red);border-color:var(--red)}.btn.ghost{background:transparent}.btn.small{padding:6px 9px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px;min-width:0}.kpi-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.kpi-icon{width:30px;height:30px;border-radius:8px;background:#282d35;display:grid;place-items:center}.kpi-num{font-size:29px;font-weight:780;margin:14px 0 4px;letter-spacing:-1px}.trend{font-size:11px;color:var(--green)}.muted{color:var(--muted)}.two{grid-template-columns:1.35fr 1fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.section-title h2{font-size:15px;margin:0}.section-title small{color:var(--muted)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#7f8b99;font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;padding:11px 9px;border-bottom:1px solid var(--line)}td{padding:13px 9px;border-bottom:1px solid #222a33;font-size:12px}tr:last-child td{border-bottom:0}.person{display:flex;gap:9px;align-items:center}.miniavatar{width:31px;height:31px;background:#29313a;border-radius:9px;display:grid;place-items:center;font-weight:800;color:#c5d0dc}.person b{display:block;font-size:12px}.person small{color:var(--muted)}.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:99px;font-size:10px;font-weight:750;background:#29303a;color:#cbd3dd}.badge.red{background:#422321;color:#ffaca4}.badge.green{background:#153b2e;color:#8ce3ba}.badge.amber{background:#44351b;color:#f9d17d}.badge.blue{background:#1d344e;color:#a6d0ff}.dot{width:5px;height:5px;border-radius:50%;background:currentColor}.pipeline{display:flex;gap:5px;margin:14px 0 18px}.stage{flex:1;background:#222831;border-radius:5px;height:6px;overflow:hidden}.stage span{display:block;height:100%;background:var(--red)}.task{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #252c34}.task:last-child{border:0}.check{width:17px;height:17px;border:1px solid #566170;border-radius:5px;flex-shrink:0;margin-top:2px;cursor:pointer}.check.done{background:var(--green);border-color:var(--green)}.task b{font-size:12px}.task small{display:block;color:var(--muted);margin-top:3px}.progress{height:6px;background:#2a3038;border-radius:8px;overflow:hidden;margin-top:9px}.progress span{height:100%;display:block;background:var(--red)}.bicep{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.bicepbox{padding:13px 10px;background:#1b2128;border:1px solid #2b333e;border-radius:10px}.letter{font-size:24px;font-weight:900;color:var(--red)}.bicepbox b{display:block;font-size:11px;margin-top:5px}.bicepbox small{color:var(--muted);font-size:10px}.empty{padding:36px;text-align:center;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#a8b2bf;font-weight:700}.field input,.field select,.field textarea{width:100%;background:#0e1217;border:1px solid #303945;color:#fff;padding:10px 11px;border-radius:8px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#a83b37}.field textarea{min-height:80px;resize:vertical}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{background:#151a21;border:1px solid #38414d;border-radius:14px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modalhead h2{font-size:18px;margin:0}.close{background:transparent;border:0;color:#aeb8c4;font-size:24px}.toast{position:fixed;bottom:22px;right:22px;background:#193c30;border:1px solid #2d7658;color:#b4f4d7;padding:12px 16px;border-radius:10px;z-index:30;display:none;box-shadow:0 10px 40px #0008}.barrow{display:grid;grid-template-columns:120px 1fr 45px;gap:10px;align-items:center;margin:15px 0;font-size:12px}.bar{height:9px;background:#2a3038;border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;background:var(--red)}.mobilemenu{display:none}.note{border:1px dashed #414b58;padding:13px;border-radius:10px;color:var(--muted);font-size:11px;line-height:1.6}.footer-note{font-size:11px;color:#667382;margin-top:20px}.hide{display:none!important}
@media(max-width:1050px){.shell{grid-template-columns:72px 1fr}.side{padding:18px 8px}.brand{padding:0 8px 20px}.brand b{font-size:17px}.brand span,.brand small,.navlabel,.nav button .label,.sidefoot{display:none}.nav button{justify-content:center;padding:12px 6px}.nav button .ico{font-size:17px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.content{padding:22px}.bicep{grid-template-columns:repeat(5,1fr)}}
@media(max-width:650px){.shell{display:block}.side{position:fixed;z-index:10;top:auto;bottom:0;left:0;right:0;height:auto;padding:7px;background:#101318;border-top:1px solid var(--line);border-right:0}.brand,.navlabel,.sidefoot{display:none}.nav{display:flex;overflow:auto;gap:2px}.nav button{min-width:54px;margin:0;padding:9px 4px;display:flex;flex-direction:column;gap:3px;font-size:9px}.nav button .label{display:block;font-size:9px}.nav button .ico{font-size:16px}.top{height:58px;padding:0 15px}.content{padding:20px 14px 90px}.pagehead{display:block}.pagehead h1{font-size:24px}.pagehead .actions{margin-top:14px}.kpis{gap:9px}.card{padding:14px}.kpi-num{font-size:24px}.three{grid-template-columns:1fr}.bicep{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.topright .pill{display:none}}

<main class="main"><header class="top"><div class="crumb"><strong style="font-size:15px;letter-spacing:.5px;color:#fff">AutoForge</strong> <span style="color:#8f9baa;margin-left:8px">Created by Furqan Khan</span> <span style="color:#566170;margin:0 8px"> / </span> <strong id="crumb">Overview</strong></div><div class="topright"><span class="pill">● DEMO MODE · NOT LIVE</span><div class="avatar">DS</div></div></header><div class="content" id="content"></div></main></div><div style="position:fixed;bottom:8px;right:16px;z-index:10;font:11px Arial,sans-serif;color:#aeb8c4;background:#111820dd;border:1px solid #2c3642;border-radius:6px;padding:6px 9px">AutoForge · Created by Furqan Khan</div>

<script>
const initial={leads:[
{id:1,name:'Amir Hakim',vehicle:'Proton Satria Neo',interest:'Full BICEP restoration',source:'Website form',status:'Qualified',owner:'Suriya',value:18000,next:'Book inspection'},

quotes:[{id:'QT-1041',customer:'Amir Hakim',project:'AF-2601 · Full BICEP',amount:18000,status:'Draft',date:'29 Oct 2026'},{id:'QT-1038',customer:'Rizal Osman',project:'AF-2602 · Powertrain',amount:7200,status:'Sent',date:'27 Oct 2026'},{id:'QT-1035',customer:'Daniel Wong',project:'Electrical architecture',amount:3600,status:'Approved',date:'25 Oct 2026'}],
parts:[{sku:'AF-ACC-014',name:'Aluminium Sports Pedal Set',category:'Accessories',stock:12,min:5,price:228},{sku:'AF-ACC-021',name:'Delrin Gear Shift Knob',category:'Accessories',stock:7,min:4,price:152},{sku:'AUD-INF-002',name:'Infinity Basslink DC',category:'Audio',stock:2,min:3,price:2788},{sku:'AF-TRM-006',name:'Carpet Mat Set',category:'Interior',stock:9,min:4,price:285},{sku:'ENG-CNS-011',name:'Engine Consumables Kit',category:'Powertrain',stock:3,min:5,price:640}],
orders:[{id:'ORD-2048',customer:'Haziq Rahman',item:'Carpet Mat Set',total:285,status:'Processing',date:'29 Oct 2026'},{id:'ORD-2047',customer:'Lee Jun',item:'Sports Pedal Set',total:228,status:'Ready to ship',date:'28 Oct 2026'},{id:'ORD-2046',customer:'S. Kumar',item:'Gear Shift Knob',total:152,status:'Completed',date:'27 Oct 2026'}],
updates:[{customer:'Amir Hakim',channel:'WhatsApp (planned)',subject:'Inspection received',status:'Draft',date:'29 Oct 2026'},{customer:'Rizal Osman',channel:'Email (planned)',subject:'Quote QT-1038 follow-up',status:'Queued',date:'29 Oct 2026'}]};
let db=JSON.parse(localStorage.getItem('autoForgeDemoDB')||'null')||initial;let page='dashboard';let tasks=[false,false,true,false];function save(){localStorage.setItem('autoForgeDemoDB',JSON.stringify(db))}function money(n){return 'RM '+Number(n).toLocaleString('en-MY',{maximumFractionDigits:0})}function badge(s){let cls=({'Qualified':'green','Approved':'green','Completed':'green','New':'blue','Sent':'blue','Inspection booked':'blue','Quote sent':'amber','Draft':'amber','Parts sourcing':'amber','Processing':'blue','Ready to ship':'amber','Low stock':'red','In progress':'blue','Inspection':'amber','Quote approval':'amber','Queued':'blue'})[s]||'';return `<span class="badge ${cls}"><span class="dot"></span>${s}</span>`}function head(kicker,title,sub,btn=''){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="sub">${sub}</p></div><div class="actions">${btn}</div></div>`}function cardtitle(title,sub='',right=''){return `<div class="section-title"><div><h2>${title}</h2>${sub?`<small>${sub}</small>`:''}</div>${right}</div>`}function btn(label,fn,primary=false){return `<button class="btn ${primary?'primary':''}" onclick="${fn}">${label}</button>`}function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||''}</tbody></table></div>`}function kpi(label,num,trend,icon){return `<div class="card"><div class="kpi-top"><span>${label}</span><span class="kpi-icon">${icon}</span></div><div class="kpi-num">${num}</div><div class="trend">${trend}</div></div>`}function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let labels={dashboard:'Overview',leads:'Leads & CRM',projects:'Restoration Jobs',workshop:'Workshop Planner',quotes:'Quotes & Approvals',inventory:'Parts & Inventory',store:'Online Store',customers:'Customer Updates',reports:'Reports',settings:'System Setup'};document.getElementById('crumb').textContent=labels[page];document.getElementById('content').innerHTML=pages[page]();}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});
const pages={dashboard:()=>{let open=db.leads.filter(x=>!['Won','Lost'].includes(x.status)).length;let pipeline=db.leads.reduce((a,x)=>a+x.value,0);return head('BUSINESS CONTROL CENTRE','AutoForge Business Overview','A single view of customer enquiries, restoration work, parts, and sales. This demo uses sample records.',btn('+ New enquiry',"openForm('lead')",true)+btn('Create job',"openForm('project')"))+`<div class="grid kpis">${kpi('Open enquiries',open,'Across website, social & referrals','♙')}${kpi('Active restoration jobs',db.projects.length,'Across BICEP service scopes','⚙')}${kpi('Pipeline value',money(pipeline),'Illustrative opportunity value','↗')}${kpi('Parts needing reorder',db.parts.filter(x=>x.stock<=x.min).length,'Stock at or below minimum','▣')}</div><div class="grid two"><div class="card">${cardtitle('Lead pipeline','Prioritise next action',btn('View all',"go('leads')"))}<div class="pipeline"><div class="stage"><span style="width:70%"></span></div><div class="stage"><span style="width:50%"></span></div><div class="stage"><span style="width:40%"></span></div><div class="stage"><span style="width:25%"></span></div></div>${table(['Customer / vehicle','Interest','Status','Next action'],db.leads.slice(0,4).map(x=>`<tr><td><div class="person"><div class="miniavatar">${x.name.split(' ').map(y=>y[0]).join('').slice(0,2)}</div><div><b>${x.name}</b><small>${x.vehicle}</small></div></div></td><td>${x.interest}</td><td>${badge(x.status)}</td><td><button class="btn small" onclick="editLead(${x.id})">Open</button></td></tr>`).join(''))}</div><div class="card">${cardtitle('Workshop snapshot','Restoration progress',btn('Planner',"go('workshop')"))}${db.projects.map(x=>`<div style="padding:12px 0;border-bottom:1px solid #252c34"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>${x.id}</b><div class="muted" style="font-size:11px;margin-top:3px">${x.customer} · ${x.scope}</div></div>${badge(x.stage)}</div><div class="progress"><span style="width:${x.progress}%"></span></div><div class="muted" style="font-size:10px;margin-top:5px">${x.progress}% complete · Target ${x.due}</div></div>`).join('')}</div></div><div class="grid two" style="margin-top:16px"><div class="card">${cardtitle('AutoForge restoration framework','All five restoration scopes')}</div><div class="card"><div class="bicep">${[['B','BODY','Rust, panels, paint'],['I','INTERIOR','Trim, seats, cabin'],['C','CHASSIS','Suspension, bushings'],['E','ELECTRICAL','Wiring, ICE, safety'],['P','POWERTRAIN','Engine, gearbox']].map(a=>`<div class="bicepbox"><div class="letter">${a[0]}</div><b>${a[1]}</b><small>${a[2]}</small></div>`).join('')}</div><div class="note" style="margin-top:14px">Recommended operating flow: enquiry → inspection → estimate → customer approval → parts & scheduling → work updates → quality check → invoice & handover → follow-up.</div></div></div>`},
leads:()=>head('CUSTOMER ACQUISITION','Leads & CRM','Capture enquiries from the website, phone, social media, referrals, and store. Assign an owner and next action.',btn('+ Add lead',"openForm('lead')",true))+`<div class="grid kpis">${kpi('Total leads',db.leads.length,'All sample enquiries','♙')}${kpi('Qualified',db.leads.filter(x=>x.status==='Qualified').length,'Ready for consultation','✓')}${kpi('Inspection booked',db.leads.filter(x=>x.status==='Inspection booked').length,'Next operational step','▦')}${kpi('Estimated pipeline',money(db.leads.reduce((a,x)=>a+x.value,0)),'Not guaranteed revenue','↗')}</div><div class="card">${cardtitle('Enquiry register','Click Open to update status',btn('Export CSV',"exportCSV('leads')"))}${table(['Customer','Vehicle','Requirement','Source','Status','Est. value','Owner','Action'],db.leads.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.vehicle}</td><td>${x.interest}</td><td>${x.source}</td><td><select onchange="setLeadStatus(${x.id},this.value)" class="inline-select">${['New','Contacted','Qualified','Inspection booked','Quote sent','Won','Lost'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></td><td>${money(x.value)}</td><td>${x.owner}</td><td><button class="btn small" onclick="editLead(${x.id})">Open</button></td></tr>`).join(''))}</div>` ,
projects:()=>head('RESTORATION OPERATIONS','Restoration jobs','Track each vehicle through the AutoForge restoration process, with clear scope, owner, due date, and customer-visible progress.',btn('+ Create job',"openForm('project')",true))+`<div class="card">${cardtitle('Job board','Sample job cards',btn('Add customer enquiry',"openForm('lead')"))}<div class="grid three">${db.projects.map(x=>`<div class="card" style="background:#10151b"><div style="display:flex;justify-content:space-between;gap:8px"><span class="badge red">${x.id}</span>${badge(x.stage)}</div><h3 style="font-size:16px;margin:15px 0 3px">${x.vehicle}</h3><div class="muted" style="font-size:12px">${x.customer}</div><div style="margin-top:13px;font-size:12px"><b>${x.scope}</b><div class="muted" style="margin-top:5px">Job owner: ${x.owner}</div><div class="muted">Target completion: ${x.due}</div></div><div class="progress"><span style="width:${x.progress}%"></span></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><small class="muted">${x.progress}% complete</small><button class="btn small" onclick="advanceJob('${x.id}')">Update stage →</button></div></div>`).join('')}</div></div><div class="note" style="margin-top:15px">Prototype workflow: inspection and photos → agreed scope → quote and approval → parts ordered → work in progress → QC checklist → invoice → vehicle handover. Actual repair records, photos, and safety sign-offs must be connected before production use.</div>`,
workshop:()=>head('CAPACITY & DELIVERY','Workshop planner','A simple view of upcoming work and job progress. A production version should add bay capacity, technician availability, and parts ETA.',btn('+ Schedule job',"openForm('project')",true))+`<div class="grid two"><div class="card">${cardtitle('Current jobs','Illustrative target dates')}${table(['Job','Vehicle / customer','Stage','Target','Progress','Action'],db.projects.map(x=>`<tr><td><b>${x.id}</b></td><td>${x.vehicle}<div class="muted">${x.customer}</div></td><td>${badge(x.stage)}</td><td>${x.due}</td><td><div style="width:100px" class="progress"><span style="width:${x.progress}%"></span></div><small class="muted">${x.progress}%</small></td><td><button class="btn small" onclick="advanceJob('${x.id}')">Advance</button></td></tr>`).join(''))}</div><div class="card">${cardtitle('Daily control checklist','Tap to mark complete')}${['Confirm inspection appointments','Review quotes awaiting customer approval','Check critical parts and supplier ETAs','Assign technicians and confirm job priorities','Complete quality-control and roadworthiness checks'].map((t,i)=>`<div class="task"><div class="check ${tasks[i]?'done':''}" onclick="tasks[${i}]=!tasks[${i}];render()">${tasks[i]?'✓':''}</div><div><b>${t}</b><small>${i<2?'Customer / sales workflow':'Workshop delivery'}</small></div></div>`).join('')}</div></div>`,
quotes:()=>head('COMMERCIAL CONTROL','Quotes & approvals','Prepare estimates, record approval status, and avoid starting chargeable work before the customer agrees.',btn('+ New quote',"openForm('quote')",true))+`<div class="grid kpis">${kpi('Quotes',db.quotes.length,'Sample quote register','▧')}${kpi('Awaiting response',db.quotes.filter(x=>x.status==='Sent').length,'Follow-up required','◷')}${kpi('Approved value',money(db.quotes.filter(x=>x.status==='Approved').reduce((a,x)=>a+x.amount,0)),'Approved sample quotes','✓')}${kpi('Draft value',money(db.quotes.filter(x=>x.status==='Draft').reduce((a,x)=>a+x.amount,0)),'Not yet sent','✎')}</div><div class="card">${cardtitle('Quote register','Sample values; not actual AutoForge quotations')}${table(['Quote ID','Customer','Scope / project','Amount','Date','Status','Action'],db.quotes.map(x=>`<tr><td><b>${x.id}</b></td><td>${x.customer}</td><td>${x.project}</td><td>${money(x.amount)}</td><td>${x.date}</td><td>${badge(x.status)}</td><td><button class="btn small" onclick="cycleQuote('${x.id}')">Change status</button></td></tr>`).join(''))}</div><div class="note" style="margin-top:15px">Suggested controls: itemised labour and parts, validity period, exclusions, deposit and payment terms, variation approval, tax treatment, and a timestamped customer acceptance record.</div>`,
inventory:()=>head('PARTS & SUPPLIER CONTROL','Parts & inventory','Track stock for AutoForge accessories and restoration consumables, flag reorders, and connect parts to jobs.',btn('+ Add part',"openForm('part')",true))+`<div class="grid kpis">${kpi('SKUs',db.parts.length,'Demo stock items','▣')}${kpi('Low stock',db.parts.filter(x=>x.stock<=x.min).length,'At/below reorder threshold','!')}${kpi('Inventory value',money(db.parts.reduce((a,x)=>a+x.stock*x.price,0)),'Indicative retail-value basis','RM')}${kpi('Supplier orders','0','Purchase-order module planned','↗')}</div><div class="card">${cardtitle('Stock register','Thresholds are demo values',btn('Export CSV',"exportCSV('parts')"))}${table(['SKU','Item','Category','On hand','Reorder at','Unit price','Stock status','Action'],db.parts.map(x=>`<tr><td>${x.sku}</td><td><b>${x.name}</b></td><td>${x.category}</td><td><b>${x.stock}</b></td><td>${x.min}</td><td>${money(x.price)}</td><td>${x.stock<=x.min?badge('Low stock'):badge('In stock')}</td><td><button class="btn small" onclick="receiveStock('${x.sku}')">Receive +1</button></td></tr>`).join(''))}</div>`,
store:()=>head('COMMERCE','Online store & orders','Prototype product catalogue and order tracking. Checkout, payment gateway, shipping, tax, and live stock are not connected.',btn('+ Add order',"openForm('order')",true))+`<div class="grid kpis">${kpi('Orders',db.orders.length,'Sample orders','🛒')}${kpi('Processing',db.orders.filter(x=>x.status==='Processing').length,'Needs fulfilment','◷')}${kpi('Order value',money(db.orders.reduce((a,x)=>a+x.total,0)),'Illustrative order total','RM')}${kpi('Store items',db.parts.length,'Sample items in inventory','▣')}</div><div class="card">${cardtitle('Order fulfilment','Update order status as work progresses')}${table(['Order','Customer','Item','Total','Date','Status','Action'],db.orders.map(x=>`<tr><td><b>${x.id}</b></td><td>${x.customer}</td><td>${x.item}</td><td>${money(x.total)}</td><td>${x.date}</td><td>${badge(x.status)}</td><td><button class="btn small" onclick="cycleOrder('${x.id}')">Next status</button></td></tr>`).join(''))}</div><div class="note" style="margin-top:15px">Production connection options: connect the existing existing e-commerce platform or rebuild the store after confirming platform, product catalogue, payment provider, shipping rules, tax settings, returns policy, and stock source of truth.</div>`,
customers:()=>head('CUSTOMER EXPERIENCE','Customer updates','Create a communication queue for inspection confirmations, quote follow-ups, parts delays, progress reports, and handover reminders.',btn('+ Create update',"openForm('update')",true))+`<div class="card">${cardtitle('Communication queue','Sending is simulated only')}${table(['Customer','Channel','Message purpose','Status','Date','Action'],db.updates.map((x,i)=>`<tr><td><b>${x.customer}</b></td><td>${x.channel}</td><td>${x.subject}</td><td>${badge(x.status)}</td><td>${x.date}</td><td><button class="btn small" onclick="markSent(${i})">Mark sent</button></td></tr>`).join(''))}</div><div class="grid three" style="margin-top:16px">${[['Lead response','Acknowledge enquiry quickly and assign an owner.'],['Work progress','Share milestone updates and approved variations.'],['Aftercare','Handover checklist, maintenance advice, review request.']].map(x=>`<div class="card"><b>${x[0]}</b><p class="muted" style="font-size:12px">${x[1]}</p></div>`).join('')}</div>`,
reports:()=>{let leads=db.leads.length,quotes=db.quotes.length,approved=db.quotes.filter(x=>x.status==='Approved').length;return head('MANAGEMENT INTELLIGENCE','Reports & performance','A lightweight KPI view to validate the operating model. Sample data only; no live analytics connection.',btn('Export leads CSV',"exportCSV('leads')",true))+`<div class="grid kpis">${kpi('Lead count',leads,'Sample records','♙')}${kpi('Quote approval rate',quotes?Math.round(approved/quotes*100)+'%':'0%','Approved / all sample quotes','✓')}${kpi('Open job value',money(db.leads.filter(x=>!['Won','Lost'].includes(x.status)).reduce((a,x)=>a+x.value,0)),'Opportunity estimate only','↗')}${kpi('Low-stock SKUs',db.parts.filter(x=>x.stock<=x.min).length,'Replenishment signals','▣')}</div><div class="grid two"><div class="card">${cardtitle('Lead status mix','Number of leads by current status')}${['New','Contacted','Qualified','Inspection booked','Quote sent','Won','Lost'].map(s=>{let n=db.leads.filter(x=>x.status===s).length;return `<div class="barrow"><span>${s}</span><div class="bar"><span style="width:${leads?n/leads*100:0}%"></span></div><b>${n}</b></div>`}).join('')}</div><div class="card">${cardtitle('Operational measures to track')}${[['Speed to first response','Median minutes from enquiry to first human response'],['Inspection conversion','Inspections booked ÷ qualified enquiries'],['Quote approval rate','Approved quotes ÷ quotes sent'],['Estimate variance','Final invoiced cost vs approved estimate'],['On-time handover','Jobs handed over by agreed target date'],['Parts availability','Jobs delayed due to missing parts']].map(x=>`<div style="padding:12px 0;border-bottom:1px solid #252c34"><b style="font-size:12px">${x[0]}</b><div class="muted" style="font-size:11px;margin-top:4px">${x[1]}</div></div>`).join('')}</div></div>`},
settings:()=>head('CONFIGURATION','System setup & rollout','Configure business rules before using real customer, vehicle, payment, or workshop data.',btn('Reset demo data',"resetDemo()"))+`<div class="grid two"><div class="card">${cardtitle('Business profile','Based on public DSR website details')}<div class="field"><label>Business name</label><input value="AutoForge" readonly></div><div class="field" style="margin-top:12px"><label>Core restoration framework</label><input value="BICEP: Body · Interior · Chassis · Electrical · Powertrain" readonly></div><div class="field" style="margin-top:12px"><label>Workshop address (verify before launch)</label><input value="Enter business address during implementation" readonly></div><div class="field" style="margin-top:12px"><label>Demo data</label><input value="Stored in this browser only" readonly></div></div><div class="card">${cardtitle('Production readiness checklist')}<div class="task"><div class="check" onclick="toggleCheck(this)"></div><div><b>Confirm workflow and staff roles</b><small>Owner, sales advisor, service advisor, technician, parts, finance</small></div></div><div class="task"><div class="check" onclick="toggleCheck(this)"></div><div><b>Confirm source of truth for products and orders</b><small>Existing website shop vs new commerce system</small></div></div><div class="task"><div class="check" onclick="toggleCheck(this)"></div><div><b>Configure customer consent and privacy notices</b><small>Contact permissions, retention, access controls</small></div></div><div class="task"><div class="check" onclick="toggleCheck(this)"></div><div><b>Connect email, WhatsApp, payments and accounting</b><small>Requires approved providers and credentials</small></div></div><div class="task"><div class="check" onclick="toggleCheck(this)"></div><div><b>Test backups, permissions and audit trail</b><small>Before real business use</small></div></div></div></div><div class="note" style="margin-top:15px">Prototype limitations: no authentication, server, database, real messaging, payment processing, accounting integration, or live website sync. Do not enter real personal, financial, or vehicle data.</div>`};
function go(p){page=p;render()}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}function closeModal(){document.getElementById('modal').classList.remove('show')}function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('show')}function field(name,label,placeholder='',type='text',full=false){return `<div class="field ${full?'full':''}"><label>${label}</label><input name="${name}" type="${type}" placeholder="${placeholder}" required></div>`}function selectField(name,label,options,full=false){return `<div class="field ${full?'full':''}"><label>${label}</label><select name="${name}">${options.map(x=>`<option>${x}</option>`).join('')}</select></div>`}function formWrap(fields,handler){return `<form onsubmit="${handler}(event)"><div class="formgrid">${fields}</div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Save demo record</button></div></form>`}
function openForm(type){let f='',title='';if(type==='lead'){title='Add customer enquiry';f=field('name','Customer name','e.g. Alex Tan')+field('vehicle','Vehicle','e.g. Proton Putra')+field('interest','Requirement','BICEP restoration')+selectField('source','Lead source',['Website form','Phone','WhatsApp','Instagram','Facebook','Referral','Walk-in'])+selectField('status','Initial status',['New','Contacted','Qualified','Inspection booked'])+field('value','Estimated opportunity value (RM)','10000','number')+field('owner','Assigned owner','Sales');}
if(type==='project'){title='Create restoration job';f=field('customer','Customer','Customer name')+field('vehicle','Vehicle / year','Proton model')+selectField('scope','BICEP scope',['Full BICEP','Body','Interior','Chassis','Electrical architecture','Powertrain & auxiliary'])+selectField('stage','Starting stage',['Inspection','Quote approval','Parts sourcing','In progress','Quality check','Ready for handover'])+field('due','Target date','', 'text')+field('owner','Job owner','Workshop lead');}
if(type==='quote'){title='Create estimate / quote';f=field('customer','Customer','Customer name')+field('project','Scope / project','BICEP restoration')+field('amount','Estimate amount (RM)','10000','number')+selectField('status','Status',['Draft','Sent','Approved','Declined']);}
if(type==='part'){title='Add inventory item';f=field('sku','SKU','AF-XXX-001')+field('name','Part name','Item name')+field('category','Category','Accessories')+field('stock','Quantity on hand','1','number')+field('min','Reorder threshold','3','number')+field('price','Unit price (RM)','100','number');}
if(type==='order'){title='Create store order';f=field('customer','Customer','Customer name')+field('item','Item','Product name')+field('total','Order total (RM)','200','number')+selectField('status','Order status',['Processing','Ready to ship','Completed','Cancelled']);}
if(type==='update'){title='Create customer update';f=field('customer','Customer','Customer name')+selectField('channel','Channel',['Email (planned)','WhatsApp (planned)','Phone task','SMS (planned)'])+field('subject','Message purpose','Inspection reminder', 'text',true)+selectField('status','Status',['Draft','Queued']);}
openModal(title,formWrap(f,'submitForm_'+type));}
function submitForm_lead(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));db.leads.unshift({id:Date.now(),...d,value:+d.value,status:d.status,owner:d.owner,next:'First response'});save();closeModal();render();toast('Enquiry added to demo CRM')}function submitForm_project(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));db.projects.unshift({id:'AF-'+String(Date.now()).slice(-4),...d,progress:0,due:d.due||'To confirm'});save();closeModal();render();toast('Restoration job created')}function submitForm_quote(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));db.quotes.unshift({id:'QT-'+String(Date.now()).slice(-4),...d,amount:+d.amount,date:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})});save();closeModal();render();toast('Quote record created')}function submitForm_part(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));db.parts.unshift({...d,stock:+d.stock,min:+d.min,price:+d.price});save();closeModal();render();toast('Inventory item added')}function submitForm_order(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));db.orders.unshift({id:'ORD-'+String(Date.now()).slice(-4),...d,total:+d.total,date:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})});save();closeModal();render();toast('Demo order created')}function submitForm_update(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));db.updates.unshift({...d,date:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})});save();closeModal();render();toast('Customer update added to queue')}
function setLeadStatus(id,s){let x=db.leads.find(x=>x.id===id);x.status=s;save();render();toast('Lead status updated')}function editLead(id){let x=db.leads.find(x=>x.id===id);openModal('Lead details',`<div class="card" style="margin-bottom:15px"><b>${x.name}</b><p class="muted">${x.vehicle} · ${x.interest}</p><p>Source: ${x.source} · Owner: ${x.owner}</p><p>Opportunity: ${money(x.value)}</p></div><div class="field"><label>Update status</label><select id="editStatus">${['New','Contacted','Qualified','Inspection booked','Quote sent','Won','Lost'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="setLeadStatus(${id},document.getElementById('editStatus').value);closeModal()">Save status</button></div>`)}function advanceJob(id){let x=db.projects.find(x=>x.id===id);let stages=['Inspection','Quote approval','Parts sourcing','In progress','Quality check','Ready for handover'];let i=stages.indexOf(x.stage);x.stage=stages[Math.min(i+1,stages.length-1)];x.progress=Math.max(x.progress,[15,25,40,65,90,100][stages.indexOf(x.stage)]);save();render();toast('Job stage updated: '+x.stage)}function cycleQuote(id){let x=db.quotes.find(x=>x.id===id);let arr=['Draft','Sent','Approved','Declined'];x.status=arr[(arr.indexOf(x.status)+1)%arr.length];save();render();toast('Quote status: '+x.status)}function receiveStock(sku){let x=db.parts.find(x=>x.sku===sku);x.stock++;save();render();toast('Received one unit of '+x.name)}function cycleOrder(id){let x=db.orders.find(x=>x.id===id);let arr=['Processing','Ready to ship','Completed'];x.status=arr[(arr.indexOf(x.status)+1)%arr.length];save();render();toast('Order status: '+x.status)}function markSent(i){db.updates[i].status='Sent (demo)';save();render();toast('Marked sent for demo only; no message was delivered')}function toggleCheck(el){el.classList.toggle('done');el.textContent=el.classList.contains('done')?'✓':''}function resetDemo(){if(confirm('Reset all local demo records to the original sample data?')){localStorage.removeItem('autoForgeDemoDB');db=JSON.parse(JSON.stringify(initial));save();render();toast('Demo data reset')}}function exportCSV(type){let rows=db[type]||[];if(!rows.length)return toast('No records to export');let keys=Object.keys(rows[0]);let csv=[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replaceAll('"','""')+'"').join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='autoforge-'+type+'-demo.csv';a.click();URL.revokeObjectURL(a.href);toast('CSV exported')}render();
</script></body></html>
